name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aqar
          POSTGRES_PASSWORD: aqar_test_pw
          POSTGRES_DB: aqar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aqar -d aqar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install the production dependency set (the same one Render installs)
        run: pip install -r requirements-dev.txt
      - name: Unit, integration and PostgreSQL tests
        env:
          TEST_DATABASE_URL: postgresql://aqar:aqar_test_pw@localhost:5432/aqar_test
        run: pytest -q -rs
      - name: Migrations apply to an empty database and match the models
        env:
          APP_ENV: development
          DATABASE_URL: postgresql://aqar:aqar_test_pw@localhost:5432/aqar_test
        run: python scripts/migrate.py && python scripts/migrate.py --check
      - name: Static site builds
        env:
          API_BASE_URL: https://api.example.com
        run: python scripts/build_frontend.py --out dist

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t aqar-api:ci .
      - name: Production mode refuses an empty configuration
        run: |
          if docker run --rm -e APP_ENV=production aqar-api:ci; then
            echo "the image started with no configuration" && exit 1
          fi
      - name: No secrets are baked into the image
        run: |
          docker run --rm --entrypoint sh aqar-api:ci -c 'test ! -e /app/.env && ! grep -rIlE "gsk_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}" /app' || exit 1
