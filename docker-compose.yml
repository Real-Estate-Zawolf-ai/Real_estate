# Local development stack: API + PostgreSQL + Qdrant.
#   cp .env.example .env   (add GEMINI_API_KEY, GROQ_API_KEY ...)
#   docker compose up --build
#
# Production does NOT use this file: it runs on Render + Neon + Qdrant Cloud
# (see DEPLOYMENT.md). The values below are throw-away local defaults.
services:
  api:
    build: .
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USERNAME:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_MAIN_DATABASE:-real_estate}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-properties}
      CORS_ALLOWED_ORIGINS: "*"
      ADMIN_API_KEY: ${ADMIN_API_KEY:-local-admin-key-change-me-0123456789}
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_MAIN_DATABASE:-real_estate}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  qdrant_data:
